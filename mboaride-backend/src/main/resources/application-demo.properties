# =====================================================================
#  Profil « demo » (présentation du cours de bases de données)
#  Lancement : ./demarrer-backend-demo.sh  (ou SPRING_PROFILES_ACTIVE=demo)
#  Affiche dans la console, pour chaque appel de l'application :
#    1. la requête HTTP reçue (méthode, URL) et la réponse JSON renvoyée,
#    2. chaque requête SQL générée par Hibernate, avec les valeurs des paramètres,
#    3. le bilan par requête HTTP : nombre d'instructions SQL et temps passé en base.
# =====================================================================

# Le backend se connecte avec le compte à privilèges limités créé dans sql/cours/04_utilisateurs_privileges.sql
spring.datasource.username=${DB_USER:mboa_backend}
spring.datasource.password=${DB_PASSWORD:Backend2026!}

# 1. Trafic HTTP : requête reçue, contrôleur appelé, réponse écrite
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=DEBUG
spring.mvc.log-request-details=true

# 2. SQL exécuté par Hibernate, mis en forme, avec les valeurs liées aux « ? »
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# 3. Statistiques par requête HTTP (nombre de requêtes SQL, durée)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

# Messages STOMP (temps réel) envoyés à l'application
logging.level.org.springframework.messaging.simp=DEBUG
