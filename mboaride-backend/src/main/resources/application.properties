# =====================================================================
#  MboaRide — configuration du backend
#  Les clés secrètes (Twilio, Monetbil, CamPay) se mettent dans
#  mboaride-local.properties (à côté de pom.xml, non versionné).
#  Voir mboaride-local.properties.example
# =====================================================================
spring.application.name=mboaride
spring.config.import=optional:file:./mboaride-local.properties,optional:file:./monetbil-local.properties

# ---------- Base de données MySQL / MariaDB (XAMPP) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mboa_ride?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Pilote déduit de l'URL : MySQL/MariaDB en local, PostgreSQL (Supabase) en déploiement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
# {vendor} = mysql ou postgresql : chaque base a son script de schéma
spring.flyway.locations=classpath:db/mboaride/{vendor}
spring.flyway.baseline-on-migrate=true

# ---------- Serveur ----------
server.port=${PORT:8080}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
spring.jackson.time-zone=Africa/Douala
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# URL publique du backend (liens de partage de trajet, reçus, webhooks de paiement)
mboaride.public-url=${PUBLIC_URL:http://localhost:8080}
# Dossier de stockage des documents et photos
mboaride.upload-dir=${UPLOAD_DIR:./uploads}
# Fuseau horaire métier (heures de pointe, nuit)
mboaride.zone-id=Africa/Douala

# ---------- Sécurité ----------
jwt.secret=${JWT_SECRET:mboaride_jwt_secret_key_2026_change_me_in_production_at_least_256_bits}
# 7 jours pour l'application mobile
# Durée d'un jeton : 1 an, renouvelé à chaque ouverture de l'application (session jusqu'à la déconnexion)
jwt.expiration=${JWT_EXPIRATION:31536000000}

# ---------- SMS (BF-01, BF-66) ----------
# SIMULATION : les SMS sont écrits dans les logs et le code OTP est renvoyé à l'app (développement)
# TWILIO     : envoi réel via Twilio
sms.mode=${SMS_MODE:SIMULATION}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# ---------- Paiement Mobile Money ----------
# Le fournisseur actif (MONETBIL / CAMPAY / SIMULATION) se choisit dans le back-office.
monetbil.service-key=${MONETBIL_SERVICE_KEY:}
monetbil.service-secret=${MONETBIL_SERVICE_SECRET:}
monetbil.widget-url=https://api.monetbil.com/widget/v2.1
monetbil.check-url=https://api.monetbil.com/payment/v1/checkPayment
monetbil.return-url=mboaride://paiement

campay.base-url=${CAMPAY_BASE_URL:https://demo.campay.net/api}
campay.username=${CAMPAY_USERNAME:}
campay.password=${CAMPAY_PASSWORD:}

# ---------- Cartographie ----------
maps.osrm-url=https://router.project-osrm.org
maps.osrm-timeout-ms=2000
maps.meteo-url=https://api.open-meteo.com/v1/forecast

# ---------- Notifications push (Expo Push API, gratuit) ----------
push.expo-url=https://exp.host/--/api/v2/push/send

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.cm.mboaride=INFO
mboaride.demo-data=${DEMO_DATA:true}
# Compte administrateur créé au premier démarrage (à changer immédiatement en production)
mboaride.admin.email=${ADMIN_EMAIL:admin@mboaride.cm}
mboaride.admin.password=${ADMIN_PASSWORD:Admin@2026}
