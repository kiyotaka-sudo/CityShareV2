spring.datasource.url=jdbc:postgresql://localhost:5432/cityshare
spring.datasource.username=cityshare_user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Si migration V2 échoue (must be owner of table), exécuter scripts/fix-db-ownership.sql
# puis relancer. Alternative : décommenter et adapter (mot de passe postgres local) :
# spring.flyway.user=postgres
# spring.flyway.password=postgres

server.port=8080
server.address=0.0.0.0

# Clés Monetbil : fichier à la racine du backend (voir monetbil-local.properties.example)
spring.config.import=optional:file:./monetbil-local.properties

# Monetbil (Cameroun — MTN / Orange Money). Valeurs par défaut si monetbil-local.properties absent
monetbil.service-key=${MONETBIL_SERVICE_KEY:}
monetbil.service-secret=${MONETBIL_SERVICE_SECRET:}
monetbil.widget-version=v2.1
monetbil.api-base=https://api.monetbil.com/widget
# URL publique du backend pour le webhook (ex. https://votre-domaine.com ou tunnel ngrok en dev)
monetbil.notify-url-base=${MONETBIL_NOTIFY_URL_BASE:http://172.20.10.2:8080}
monetbil.return-url-base=${MONETBIL_RETURN_URL_BASE:cityshare://payment}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.codec.max-in-memory-size=10MB

jwt.secret=cityshare_jwt_secret_key_2025_must_be_at_least_256_bits_long
jwt.expiration=86400000

springdoc.swagger-ui.path=/swagger-ui.html
